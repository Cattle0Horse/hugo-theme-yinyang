{{ define "main" }}
<article class="notes {{ .Site.Language.Locale }}">
  <div class="row"><div class="col-xs-12">
    <header class="notes-header">
      {{ with .Title }}<h1 class="notes-page-title">{{ . }}</h1>{{ end }}
      {{ with .Content }}<div class="notes-intro markdown-body">{{ . }}</div>{{ end }}
    </header>

    {{ $paginator := partial "notes-paginator.html" . }}
    {{ partial "notes-list.html" (dict "Paginator" $paginator) }}
  </div></div>
</article>
{{ end }}
