<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}" prefix="og: http://ogp.me/ns#">
{{ partial "head.html" . }}
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <div class="app-scroll" id="appScroll">
          <header class="app-header" id="appHeader">
            {{ partial "header.html" . }}
          </header>
          {{ block "main" . }}{{ end }}
        </div>
      </div>
      {{ block "toc" . }}{{ end }}
    </main>
  </div>
  {{ partial "runtime-body.html" . }}
  {{ .Site.Params.extraBody | safeHTML }}
</body>
</html>
