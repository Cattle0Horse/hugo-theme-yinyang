{{ define "main" }}
<article class="post {{ .Site.Language.Locale }}" id="article">
  <div class="row">
    <div class="col-xs-12">
      <h1 class="taxonomy-term">{{ .Data.Plural | humanize }}</h1>
      <div id="posts-list">
        {{ partial "terms-list.html" . }}
      </div>
    </div>
  </div>
</article>
{{ end }}
