{{ if and .Site.Params.tableOfContents .TableOfContents (ne .Params.toc false) }}
<aside class="post-toc-sidebar" id="tocSidebar" tabindex="-1" aria-label="文章目录" aria-hidden="true">
  <div class="toc-sidebar-header">
    <div class="toc-heading"><span class="toc-sidebar-title">文章目录</span><div class="toc-article-title">{{ .Title }}</div></div>
    <button class="toc-close action-button" type="button" aria-label="关闭目录">{{ partial "icon.html" (dict "name" "close" "wrap" "action-icon") }}</button>
  </div>
  <div class="toc-scroll" id="tocScroll">
    <nav class="toc-nav">
      <span class="toc-track" aria-hidden="true"><span class="toc-indicator" id="tocIndicator"></span></span>
      {{ .TableOfContents }}
    </nav>
  </div>
</aside>

<button class="toc-float-btn action-button" id="tocFloatBtn" type="button" aria-label="打开目录" aria-controls="tocSidebar" aria-expanded="false">
  <span class="action-icon" aria-hidden="true">{{ partial "icon.html" (dict "name" "list") }}</span>
</button>
<div class="toc-backdrop" id="tocBackdrop"></div>

{{ end }}
