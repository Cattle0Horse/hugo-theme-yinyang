{{ if and .Site.Params.tableOfContents .TableOfContents (not (eq .Params.toc false)) }}
<aside class="post-toc-sidebar" id="tocSidebar">
  <div class="toc-sidebar-header">
    <span class="toc-sidebar-title">目录</span>
    <button class="toc-close-btn" id="tocCloseBtn" aria-label="关闭目录">&times;</button>
  </div>
  <nav class="toc-nav">
    {{ .TableOfContents }}
  </nav>
</aside>

<button class="toc-float-btn" id="tocFloatBtn" aria-label="目录">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="3" width="16" height="2" rx="1" fill="currentColor"/>
    <rect x="2" y="9" width="12" height="2" rx="1" fill="currentColor"/>
    <rect x="2" y="15" width="14" height="2" rx="1" fill="currentColor"/>
  </svg>
</button>

<div class="toc-backdrop" id="tocBackdrop"></div>

{{ partial "toc-script.html" . }}
{{ end }}
