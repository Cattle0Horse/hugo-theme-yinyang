{{- $paletteState := partial "palette-state.html" . -}}
<header class="site-header-content">
  <div class="header-title">
    <a href="/"
      >{{ or .Site.Params.headTitle .Site.Params.author.name }}</a
    >
  </div>
  <div class="header-subtitle">{{ .Site.Params.Description }}</div>
  <div class="header-items">
    <div class="header-item appearance-controls">
      <button class="theme-toggle action-button" id="theme-toggle" type="button" aria-label="选择明暗模式" aria-haspopup="menu" aria-expanded="false" data-tooltip="选择明暗模式">
        <span class="action-icon theme-toggle-dark" aria-hidden="true">{{ partial "icon.html" (dict "name" "moon") }}</span>
        <span class="action-icon theme-toggle-light" aria-hidden="true">{{ partial "icon.html" (dict "name" "sun") }}</span>
        <span class="action-icon theme-toggle-system" aria-hidden="true">{{ partial "icon.html" (dict "name" "monitor") }}</span>
      </button>
      {{- if $paletteState.allowUserChoice }}
      <button class="palette-toggle action-button" id="palette-toggle" type="button" aria-label="选择配色" aria-haspopup="menu" aria-expanded="false" data-tooltip="选择配色">
      </button>
      {{- end }}
    </div>
    {{ range .Site.Params.socials }}
    <div class="header-item">
      <a href="{{ .link }}"{{ if hasPrefix .link "http" }} target="_blank" rel="noopener"{{ end }}>{{ .name }}</a>
    </div>
    {{ end }}
  </div>
  <div class="header-line"></div>
</header>
