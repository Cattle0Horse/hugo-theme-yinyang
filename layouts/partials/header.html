<header class="site-header-content">
  <div class="header-title">
    <a href="/"
      >{{ or .Site.Params.headTitle .Site.Params.author.name }}</a
    >
  </div>
  <div class="header-subtitle">{{ .Site.Params.Description }}</div>
  <div class="header-items">
    <div class="header-item">
      <button class="theme-toggle action-button" id="theme-toggle" type="button" aria-label="切换至深色模式" data-tooltip="切换至深色模式">
        <span class="action-icon theme-toggle-dark" aria-hidden="true">{{ partial "icon.html" (dict "name" "moon") }}</span>
        <span class="action-icon theme-toggle-light" aria-hidden="true">{{ partial "icon.html" (dict "name" "sun") }}</span>
      </button>
    </div>
    {{ range .Site.Params.socials }}
    <div class="header-item">
      <a href="{{ .link }}"{{ if hasPrefix .link "http" }} target="_blank" rel="noopener"{{ end }}>{{ .name }}</a>
    </div>
    {{ end }}
  </div>
  <div class="header-line"></div>
</header>
