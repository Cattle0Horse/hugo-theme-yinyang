<div class="ui-tooltip" id="uiTooltip" role="tooltip" aria-hidden="true"></div>
<script data-page-runtime>
;(function (runtime) {
  var tables = []
  document.querySelectorAll('.markdown-body table').forEach(function (table) {
    if (table.closest('.highlight, .table-scroll')) return
    var region = document.createElement('div')
    var hint = document.createElement('p')
    region.className = 'table-scroll'
    hint.className = 'table-scroll-hint'
    hint.textContent = '左右滑动查看完整表格'
    table.parentNode.insertBefore(region, table)
    region.appendChild(table)
    region.after(hint)
    tables.push({ region: region, hint: hint })
  })

  function updateTables() {
    tables.forEach(function (item) {
      var overflow = item.region.scrollWidth > item.region.clientWidth + 1
      item.hint.hidden = !overflow
      if (overflow) {
        item.region.setAttribute('tabindex', '0')
        item.region.setAttribute('role', 'region')
        item.region.setAttribute('aria-label', '表格，可横向滚动查看完整内容')
      } else {
        item.region.removeAttribute('tabindex')
        item.region.removeAttribute('role')
        item.region.removeAttribute('aria-label')
      }
    })
  }
  updateTables()
  runtime.listen(window, 'resize', updateTables)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(runtime.guard(updateTables))

  var scroll = document.getElementById('appScroll')
  var wideMq = window.matchMedia('(min-width: 84em)')

  function isWide() { return wideMq.matches }
  runtime.expose('isWide', isWide)

  if (scroll) {
    var scrollFrame = 0
    var activeScrollEl = isWide() ? document.documentElement : scroll
    var previousMode = isWide()
    var readingPosition = null

    function rememberPosition() {
      if (previousMode !== isWide() || document.documentElement.classList.contains('toc-open')) return
      var rect = scroll.getBoundingClientRect()
      var top = isWide() ? 0 : rect.top
      var contentRect = document.querySelector('.app-content').getBoundingClientRect()
      var hit = document.elementFromPoint(contentRect.left + contentRect.width / 2, top + 64)
      var anchor = hit && hit.closest('p, pre, table, h1, h2, h3, h4, .note-entry, .posts-line, .code-block-wrapper')
      if (anchor && !scroll.contains(anchor)) anchor = null
      readingPosition = {
        anchor: anchor,
        top: anchor ? anchor.getBoundingClientRect().top - top : 0,
        offset: isWide() ? window.scrollY : scroll.scrollTop
      }
    }

    function restoreReadingPosition() {
      var saved = readingPosition
      previousMode = isWide()
      if (saved) {
        var target = saved.offset
        if (saved.anchor && saved.anchor.isConnected) {
          var viewportTop = isWide() ? 0 : scroll.getBoundingClientRect().top
          var offset = isWide() ? window.scrollY : scroll.scrollTop
          target = offset + saved.anchor.getBoundingClientRect().top - viewportTop - saved.top
        }
        ;(isWide() ? window : scroll).scrollTo({ top: Math.max(0, target), behavior: 'instant' })
      }
      updateScrollState()
    }

    function updateScrollState() {
      runtime.cancelAnimationFrame(scrollFrame)
      scrollFrame = runtime.requestAnimationFrame(rememberPosition)
      // swap active scroll target on breakpoint change
      var next = isWide() ? document.documentElement : scroll
      if (next !== activeScrollEl) {
        activeScrollEl.classList.remove('show-scrollbar')
        activeScrollEl = next
      }
      nearScrollbar = false
    }

    // ---- scrollbar visibility: show only when scrolling or near scrollbar ----
    var scrollTimer = 0
    var SCROLLBAR_VISIBLE_MS = 600
    var nearScrollbar = false
    var cachedRect = null
    var mouseFrame = 0

    function requestHideScrollbar(el) {
      runtime.clearTimeout(scrollTimer)
      scrollTimer = runtime.setTimeout(function () {
        if (!nearScrollbar) el.classList.remove('show-scrollbar')
      }, SCROLLBAR_VISIBLE_MS)
    }
    function showScrollbarTemporary() {
      activeScrollEl.classList.add('show-scrollbar')
      requestHideScrollbar(activeScrollEl)
    }

    runtime.listen(scroll, 'scroll', showScrollbarTemporary, { passive: true })
    runtime.listen(window, 'scroll', showScrollbarTemporary, { passive: true })

    runtime.listen(document, 'mousemove', function (e) {
      runtime.cancelAnimationFrame(mouseFrame)
      mouseFrame = runtime.requestAnimationFrame(function () {
        if (!cachedRect) cachedRect = activeScrollEl.getBoundingClientRect()
        var wasNear = nearScrollbar
        nearScrollbar = e.clientX > cachedRect.right - 24
        if (nearScrollbar) {
          activeScrollEl.classList.add('show-scrollbar')
          runtime.clearTimeout(scrollTimer)
        } else if (wasNear) {
          requestHideScrollbar(activeScrollEl)
        }
      })
    }, { passive: true })

    runtime.listen(window, 'resize', function () { cachedRect = null })
    runtime.listen(wideMq, 'change', function () { cachedRect = null })

    runtime.listen(scroll, 'scroll', updateScrollState, { passive: true })
    runtime.listen(window, 'scroll', updateScrollState, { passive: true })
    runtime.listen(window, 'resize', updateScrollState)
    runtime.listen(wideMq, 'change', restoreReadingPosition)
    rememberPosition()
    updateScrollState()
    if (location.hash) {
      runtime.requestAnimationFrame(function () {
        var hash = location.hash.slice(1)
        try { hash = decodeURIComponent(hash) } catch (error) {}
        var target = document.getElementById(hash)
        if (target) {
          if (isWide()) {
            var top = target.getBoundingClientRect().top + window.scrollY - 64
            window.scrollTo({ top: Math.max(0, top), behavior: 'auto' })
          } else {
            var scrollRect = scroll.getBoundingClientRect()
            scroll.scrollTop = Math.max(0, target.getBoundingClientRect().top - scrollRect.top + scroll.scrollTop - 64)
          }
        }
      })
    }
  }

  var tooltip = document.getElementById('uiTooltip')
  var active = null
  var timer = 0

  function positionTooltip(target) {
    if (!tooltip || !target) return
    var rect = target.getBoundingClientRect()
    var tip = tooltip.getBoundingClientRect()
    var top = rect.top - tip.height - 8
    var below = top < 8
    if (below) top = rect.bottom + 8
    var left = rect.left + (rect.width - tip.width) / 2
    left = Math.max(8, Math.min(left, window.innerWidth - tip.width - 8))
    tooltip.style.left = left + 'px'
    tooltip.style.top = top + 'px'
    tooltip.classList.toggle('is-below', below)
  }

  function show(target, delayed) {
    runtime.clearTimeout(timer)
    if (target.hasAttribute('data-copy-feedback')) return
    timer = runtime.setTimeout(function () {
      active = target
      tooltip.textContent = target.getAttribute('data-tooltip') || target.getAttribute('aria-label')
      tooltip.setAttribute('aria-hidden', 'false')
      tooltip.classList.add('is-visible')
      positionTooltip(target)
    }, delayed ? 300 : 0)
  }

  function hide(target) {
    runtime.clearTimeout(timer)
    if (target && active && target !== active) return
    active = null
    tooltip.classList.remove('is-visible')
    tooltip.setAttribute('aria-hidden', 'true')
  }

  runtime.expose('updateActionTooltip', function (target) {
    if (active !== target) return
    tooltip.textContent = target.getAttribute('data-tooltip') || target.getAttribute('aria-label')
    positionTooltip(target)
  })

  runtime.expose('hideActionTooltip', function (target) {
    hide(target)
  })

  if (window.matchMedia('(hover: hover)').matches) {
    runtime.listen(document, 'mouseover', function (event) {
      var target = event.target.closest('[data-tooltip]')
      if (target && !target.contains(event.relatedTarget)) show(target, true)
    })
    runtime.listen(document, 'mouseout', function (event) {
      var target = event.target.closest('[data-tooltip]')
      if (target && !target.contains(event.relatedTarget)) hide(target)
    })
  }
  runtime.listen(document, 'focusin', function (event) {
    var target = event.target.closest('[data-tooltip]')
    if (target && target.matches(':focus-visible')) show(target, false)
  })
  runtime.listen(document, 'focusout', function (event) {
    var target = event.target.closest('[data-tooltip]')
    if (target) hide(target)
  })
  runtime.listen(window, 'resize', function () { if (active) positionTooltip(active) })
})(window.yinyangRuntime.page)
</script>
