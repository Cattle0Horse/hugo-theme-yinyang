<section class="nf-terminal-scene" data-nf-scene="terminal" data-nf-devices="desktop">
<h1 class="nf-sr-only">迷路终端</h1>
<div class="nf-terminal">
  <div class="nf-terminal-bar"><span>● ● ●</span><span>lost@wherever: ~</span></div>
  <div class="nf-terminal-screen"><p><span class="nf-muted">$</span> find this-page</p><p class="nf-terminal-error">404: page not found<span class="nf-caret">_</span></p><div class="nf-terminal-output" role="log" aria-live="polite"></div>
  <form class="nf-terminal-form"><label for="nf-command">❯</label><input id="nf-command" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="终端命令：help、cd ~、pwd、ls、clear、home、random" placeholder="help / cd ~ / ls"><button aria-label="执行命令">↵</button></form>
  <div class="nf-terminal-footer"><p class="nf-terminal-status" data-nf-status role="status" aria-live="polite"></p><a class="nf-terminal-home" href="{{ site.Home.RelPermalink }}">$ cd ~ <span aria-hidden="true">↵</span></a></div></div>
</div>
</section>
