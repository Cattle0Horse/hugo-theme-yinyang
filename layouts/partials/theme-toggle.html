<script>
;(function () {
  var themeBtn = document.getElementById("theme-toggle")
  if (!themeBtn) return
  var paletteBtn = document.getElementById("palette-toggle")
  var paletteState = {{ partial "palette-state.html" . | jsonify | safeJS }}
  var themeNames = { light: "亮色", dark: "暗色", system: "跟随浏览器" }
  var themeModes = ["light", "dark", "system"]
  var browserTheme = window.matchMedia("(prefers-color-scheme: dark)")
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)")
  var html = document.documentElement
  var menu = null
  var themeTransition = null
  var themeAnimation = null

  function currentValue(kind) {
    if (kind === "theme") return html.getAttribute("data-theme-mode") || "system"
    return html.getAttribute("data-palette") || paletteState.default
  }

  function updateLabel(button, label) {
    if (!button) return
    button.setAttribute("aria-label", label)
    button.setAttribute("data-tooltip", label)
    if (window.updateActionTooltip) window.updateActionTooltip(button)
  }

  function nextThemeMode(mode) {
    return themeModes[(themeModes.indexOf(mode) + 1) % themeModes.length]
  }

  function updateLabels() {
    var mode = currentValue("theme")
    var nextMode = nextThemeMode(mode)
    updateLabel(themeBtn, "当前：" + themeNames[mode] + "；点击切换为" + themeNames[nextMode])
    updateLabel(paletteBtn, "选择配色，当前：" + paletteState.names[currentValue("palette")])
  }

  function applyAppearanceChange(callback, event) {
    if (themeAnimation) themeAnimation.cancel()
    if (themeTransition) themeTransition.skipTransition()
    function updateAppearance() {
      html.classList.add("theme-changing")
      html.offsetWidth
      callback()
      requestAnimationFrame(function () { html.classList.remove("theme-changing") })
    }
    if (!event || reducedMotion.matches || !document.startViewTransition) {
      updateAppearance()
      return
    }
    var bounds = themeBtn.getBoundingClientRect()
    var x = event.detail ? event.clientX : bounds.left + bounds.width / 2
    var y = event.detail ? event.clientY : bounds.top + bounds.height / 2
    var radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y))
    html.classList.add("theme-revealing")
    var transition = document.startViewTransition(updateAppearance)
    themeTransition = transition
    transition.ready.then(function () {
      if (themeTransition !== transition) return
      themeAnimation = html.animate({
        clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + radius + "px at " + x + "px " + y + "px)"]
      }, {
        duration: 450,
        easing: "ease-in-out",
        fill: "both",
        pseudoElement: "::view-transition-new(root)"
      })
    }).catch(function () { transition.skipTransition() })
    function finishTransition() {
      if (themeTransition !== transition) return
      themeTransition = null
      if (themeAnimation) themeAnimation.cancel()
      themeAnimation = null
      html.classList.remove("theme-revealing")
    }
    transition.finished.then(finishTransition, finishTransition)
  }

  function applyTheme() {
    var theme = currentValue("theme")
    if (theme === "system") theme = browserTheme.matches ? "dark" : "light"
    html.setAttribute("data-theme", theme)
  }

  function setValue(kind, value, event) {
    var available = kind === "theme" ? themeModes : paletteState.available
    if (available.indexOf(value) === -1) return
    var resolvedTheme = value === "system" ? (browserTheme.matches ? "dark" : "light") : value
    if (kind !== "theme" || resolvedTheme === html.getAttribute("data-theme")) event = null
    applyAppearanceChange(function () {
      if (kind === "theme") {
        html.setAttribute("data-theme-mode", value)
        applyTheme()
      } else {
        html.setAttribute("data-palette", value)
      }
      try {
        if (kind === "theme" && value === "system") localStorage.removeItem("theme")
        else localStorage.setItem(kind, value)
      } catch (error) {}
      updateLabels()
    }, event)
  }

  function positionMenu() {
    if (!menu) return
    var anchor = paletteBtn.getBoundingClientRect()
    var bounds = menu.getBoundingClientRect()
    var left = Math.max(8, Math.min(anchor.left, window.innerWidth - bounds.width - 8))
    var top = anchor.bottom + 8
    if (top + bounds.height > window.innerHeight - 8) top = Math.max(8, anchor.top - bounds.height - 8)
    menu.style.left = left + "px"
    menu.style.top = top + "px"
  }

  function closeMenu(returnFocus) {
    if (!menu) return
    var node = menu
    menu = null
    node.classList.add("is-closing")
    node.classList.remove("is-open")
    node.removeAttribute("id")
    node.setAttribute("aria-hidden", "true")
    node.inert = true
    paletteBtn.setAttribute("aria-expanded", "false")
    if (returnFocus) paletteBtn.focus()
    if (reducedMotion.matches) {
      node.remove()
      return
    }
    var timer = setTimeout(finishClose, 220)
    function finishClose() {
      clearTimeout(timer)
      node.removeEventListener("transitionend", onTransitionEnd)
      node.remove()
    }
    function onTransitionEnd(event) {
      if (event.target === node && event.propertyName === "opacity") finishClose()
    }
    node.addEventListener("transitionend", onTransitionEnd)
  }

  function openMenu() {
    if (menu) {
      closeMenu(true)
      return
    }
    var node = document.createElement("div")
    node.id = "palette-menu"
    node.className = "appearance-menu palette-menu"
    node.setAttribute("role", "menu")
    node.setAttribute("aria-label", "配色方案")
    paletteState.available.forEach(function (value) {
      var option = document.createElement("button")
      option.type = "button"
      option.className = "appearance-option palette-option"
      option.setAttribute("role", "menuitemradio")
      option.setAttribute("aria-label", paletteState.names[value])
      option.setAttribute("data-appearance-value", value)
      option.setAttribute("aria-checked", value === currentValue("palette") ? "true" : "false")
      option.setAttribute("title", paletteState.names[value])
      node.appendChild(option)
    })
    menu = node
    document.body.appendChild(node)
    positionMenu()
    paletteBtn.setAttribute("aria-expanded", "true")
    if (window.hideActionTooltip) window.hideActionTooltip(paletteBtn)
    requestAnimationFrame(function () {
      if (menu !== node) return
      node.classList.add("is-open")
      node.querySelector('[aria-checked="true"]').focus()
    })
  }

  applyTheme()
  updateLabels()
  browserTheme.addEventListener("change", function () {
    if (currentValue("theme") === "system") applyAppearanceChange(applyTheme)
  })

  document.addEventListener("click", function (event) {
    var trigger = event.target.closest("#theme-toggle, #palette-toggle")
    if (trigger) {
      event.preventDefault()
      if (trigger === themeBtn) {
        closeMenu(false)
        setValue("theme", nextThemeMode(currentValue("theme")), event)
      } else openMenu()
      return
    }
    var option = event.target.closest("[data-appearance-value]")
    if (menu && option && menu.contains(option)) {
      setValue("palette", option.getAttribute("data-appearance-value"))
      closeMenu(true)
      return
    }
    if (menu && !menu.contains(event.target)) closeMenu(false)
  })

  document.addEventListener("keydown", function (event) {
    if (event.target === paletteBtn && event.key === "ArrowDown") {
      event.preventDefault()
      openMenu()
      return
    }
    if (!menu || !menu.contains(event.target)) return
    var options = Array.prototype.slice.call(menu.querySelectorAll(".appearance-option"))
    var index = options.indexOf(document.activeElement)
    if (event.key === "Escape") {
      event.preventDefault()
      closeMenu(true)
    } else if (["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].indexOf(event.key) !== -1) {
      event.preventDefault()
      var offset = event.key === "ArrowDown" || event.key === "ArrowRight" ? 1 : -1
      options[(index + offset + options.length) % options.length].focus()
    } else if (event.key === "Home" || event.key === "End") {
      event.preventDefault()
      options[event.key === "Home" ? 0 : options.length - 1].focus()
    } else if (event.key === "Tab") {
      event.preventDefault()
      var controls = Array.prototype.slice.call(document.querySelectorAll(".header-items a, .header-items button"))
        .filter(function (control) { return control.getClientRects().length > 0 && !control.closest('[hidden]') })
      var target = controls[controls.indexOf(paletteBtn) + (event.shiftKey ? -1 : 1)]
      closeMenu(false)
      if (target) target.focus()
    }
  })

  window.addEventListener("resize", function () { if (menu) positionMenu() })
  document.addEventListener("focusin", function (event) {
    if (menu && event.target !== paletteBtn && !menu.contains(event.target)) closeMenu(false)
  })
  document.addEventListener("scroll", function () { if (menu) closeMenu(false) }, true)
})()
</script>
