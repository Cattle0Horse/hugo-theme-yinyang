<script data-page-head type="application/ld+json">
  {{- $pageTitle := cond .IsHome .Site.Title (partial "page-title.html" .) -}}
  {{- $keywords := default (slice) .Params.tags -}}
  {{- with .Params.note_tags }}{{ $keywords = . }}{{ end -}}
  {
      "@context" : "https://schema.org",
      "@type" : "BlogPosting",
      "mainEntityOfPage": {
           "@type": "WebPage",
           "@id": "{{ .Site.BaseURL }}"
      },
      "articleSection" : "{{ .Section }}",
      "name" : {{ $pageTitle | jsonify | safeJS }},
      "headline" : {{ $pageTitle | jsonify | safeJS }},
      {{ if .IsHome -}}
      "description" : "{{ .Site.Params.description | plainify }}",
      {{- else -}}
      "description" : "{{ default .Summary .Description | plainify }}",
      {{- end }}
      "author" : "{{ .Site.Params.author.name }}",
      "creator" : "{{ .Site.Params.author.name }}",
      "publisher": "{{ .Site.Params.author.name }}",
      "accountablePerson" : "{{ .Site.Params.author.name }}",
      "copyrightHolder" : "{{ .Site.Params.author.name }}",
      "copyrightYear" : "{{ .Date.Format "2006" }}",
      "datePublished": "{{ .Date }}",
      "dateModified" : "{{ .Date }}",
      "url" : "{{ .Permalink }}",
      "keywords" : {{ $keywords | jsonify | safeJS }}
  }
</script>
