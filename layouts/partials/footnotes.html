{{ if not .IsHome -}}
<script>
;(function () {
	var FN_RE = /^#fn((ref)?):(\d+)(?:-(\d+))?$/
	var lastHighlighted = null

	function addTooltip(link, text) {
		link.setAttribute("data-tooltip", text)
		link.setAttribute("aria-label", text)
	}

	function setupTooltips() {
		document.querySelectorAll('a[href^="#fn:"]').forEach(function (link) {
			var match = link.getAttribute("href").match(FN_RE)
			if (match) addTooltip(link, "查看脚注 " + match[3])
		})

		document.querySelectorAll('a[href^="#fnref:"]').forEach(function (link) {
			var match = link.getAttribute("href").match(FN_RE)
			if (!match) return
			var occurrence = match[4]
			addTooltip(link, occurrence ? "返回第 " + occurrence + " 处引用" : "返回引用处")
		})
	}

	function scrollToTarget(target) {
		var scroll = document.getElementById("appScroll")
		if (!scroll || (window.isWide && window.isWide())) {
			target.scrollIntoView({ behavior: "smooth", block: "center" })
			return
		}

		var scrollRect = scroll.getBoundingClientRect()
		var targetRect = target.getBoundingClientRect()
		var centered = scroll.scrollTop + targetRect.top - scrollRect.top - (scroll.clientHeight - targetRect.height) / 2
		var max = Math.max(0, scroll.scrollHeight - scroll.clientHeight)
		scroll.scrollTo({ top: Math.max(0, Math.min(centered, max)), behavior: "smooth" })
	}

	function highlight(hash) {
		var m = hash.match(FN_RE)
		if (!m) return false
		var target = document.getElementById(hash.slice(1))
		if (!target) return false
		var kind = m[2] === undefined ? "footnote" : "ref"

		if (lastHighlighted) lastHighlighted.classList.remove("footnote-highlight", "ref-highlight")

		target.offsetWidth
		target.classList.add(kind === "footnote" ? "footnote-highlight" : "ref-highlight")
		lastHighlighted = target

		requestAnimationFrame(function () {
			scrollToTarget(target)
		})
		return true
	}
	setupTooltips()
	document.addEventListener("click", function (e) {
		var link = e.target.closest("a")
		if (!link) return
		if (e.ctrlKey || e.metaKey || e.shiftKey) return
		var href = link.getAttribute("href")
		if (!href || !href.startsWith("#fn") || !FN_RE.test(href)) return
		if (highlight(href)) {
			e.preventDefault()
			history.pushState(null, "", href)
		}
	})
	window.addEventListener("hashchange", function () {
		highlight(location.hash)
	})
	if (location.hash) {
		highlight(location.hash)
	}
})()
</script>
{{ end }}
