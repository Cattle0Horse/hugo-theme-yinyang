<div id="posts-list" class="posts-list">
  {{ range .Pages.GroupByDate "2006" }}
  <section class="timeline-group">
    <h1 class="site-date-catalog timeline-heading">{{ .Key }}</h1>
    {{ range .Pages }}
    <div class="posts-line timeline-entry">
      <div class="posts-date"><time data-transition-time="{{ .RelPermalink }}" datetime="{{ .Date.Format "2006-01-02 15:04:05 MST" }}">{{ .Date.Format $.DateFormat }}</time></div>
      <div class="posts-title" data-transition-title="{{ .RelPermalink }}"><a href="{{ .RelPermalink }}">{{ .Title }}</a></div>
    </div>
    {{ end }}
  </section>
  {{ end }}
</div>
