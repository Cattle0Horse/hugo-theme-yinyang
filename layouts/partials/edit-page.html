{{ if and .Site.Params.editPageRepo .File }}
<div class="edit-page">
  <hr>
  <a href="{{ .Site.Params.editPageRepo }}/edit/{{ .Site.Params.editPageBranch | default "main" }}/content/{{ .File.Path | replaceRE " " "%20" | safeURL }}">
    {{ .Site.Params.editPageText | default "有错误？欢迎提交 Pull Request。" }}
  </a>
</div>
{{ end }}
