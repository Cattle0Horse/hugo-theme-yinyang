{{ if and .RawContent .Site.Params.markdownActions }}
<span class="markdown-actions">
  <button id="copy-markdown-btn" class="markdown-action-btn" title="Copy Markdown">Copy</button>
  <button id="view-raw-btn" class="markdown-action-btn" title="View Raw Markdown">Raw</button>
</span>

<script id="raw-markdown-content" type="text/plain">{{ .RawContent }}</script>
<script>
(function () {
  var raw = document.getElementById('raw-markdown-content');
  if (!raw) return;

  function copyToClipboard(text) {
    try {
      // Fallback using execCommand for browsers without clipboard API or on HTTP
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      ta.style.opacity = '0';
      ta.style.pointerEvents = 'none';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  // Copy as Markdown
  var copyBtn = document.getElementById('copy-markdown-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', function () {
      var text = raw.textContent;
      function done(success) {
        copyBtn.textContent = success ? 'Copied!' : 'Failed';
        setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          done(true);
        }).catch(function () {
          // navigator.clipboard.writeText exists but rejected
          // (e.g., non-HTTPS page). Fall through to execCommand.
          done(copyToClipboard(text));
        });
      } else {
        done(copyToClipboard(text));
      }
    });
  }

  // View Raw
  var viewBtn = document.getElementById('view-raw-btn');
  if (viewBtn) {
    viewBtn.addEventListener('click', function () {
      var blob = new Blob([raw.textContent], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var win = window.open(url, '_blank');
      if (win) {
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      } else {
        // Popup blocked — clean up immediately and give feedback
        URL.revokeObjectURL(url);
        viewBtn.textContent = 'Blocked';
        setTimeout(function () { viewBtn.textContent = 'Raw'; }, 2000);
      }
    });
  }
})();
</script>
{{ end }}
