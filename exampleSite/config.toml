baseURL = "https://cattle0horse.github.io"
locale = "zh-cn"
theme = "yinyang"

[permalinks]
posts = "/blog/:title/"

# 代码高亮
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    style = "tango"
    tabWidth = 2

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
headTitle = "CattleHorse's Blog"
description = "By accumulating small steps, one can reach a thousand miles."
mainSections = ["posts"]
postHeaderContent = ""
lazyImage = true
imageLoading = true
favicon = "/logo.png"
extraCSSFiles = ["css/background.css"]
extraHead = '''
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@callmebill/lxgw-wenkai-web@latest/lxgwwenkai-regular/result.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.min.css" />
  <style>
    body { font-family: "LXGW WenKai", sans-serif; }
    pre, code { font-family: "Fira Code", "SF Mono", Menlo, monospace; }
  </style>
'''
editPageRepo = "https://github.com/Cattle0Horse/Cattle0Horse.github.io"
markdownActions = true
tableOfContents = true
codeMaxLines = 15
editPageBranch = "main"
editPageText = "有错误？欢迎提交 Pull Request"

[params.aiLabel]
enabled = true
assisted = "AI 辅助创作"
generated = "AI 生成 · 经人工编辑"

[params.author]
homepage = "https://github.com/cattle0horse"
name = "CattleHorse"

[[params.socials]]
name = "Tags"
link = "/tags/"

[[params.socials]]
name = "Categories"
link = "/categories/"

[[params.socials]]
name = "RSS"
link = "/index.xml"

[[params.socials]]
name = "Github"
link = "https://github.com/cattle0horse"
